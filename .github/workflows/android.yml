name: Android ARM64

on:
  push:
    branches: [main]
    tags: ['v*-dev.*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: '构建验证成功后发布开发预发布版（debug 签名）'
        required: true
        type: boolean
        default: false
      release_tag:
        description: '新预发布标签，例如 v0.1.4-dev.1；不会覆盖已有 Release'
        required: true
        type: string
        default: v0.1.4-dev.1

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, lint and build ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned Android SDK
        run: bash scripts/setup-ci-android.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, build and lint
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Verify and package ARM64 APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$sdk_tools/apksigner" verify --verbose "$apk"
          badging="$($sdk_tools/aapt dump badging "$apk")"
          version="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$badging" | head -n1)"
          test -n "$version"
          python3 scripts/verify-apk.py "$apk"
          mkdir -p dist
          cp "$apk" "dist/PathPilot-${version}-arm64-debug.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### ARM64 development build"
            echo "Version: $version"
            echo "Commit: $GITHUB_SHA"
            echo "APK signature and arm64-v8a-only packaging verified."
            echo 'Debug signing: this artifact is for development testing.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: PathPilot-arm64-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/test/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          retention-days: 30

  publish:
    name: Publish development prerelease
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      APP_VERSION: ${{ needs.build.outputs.version }}
      BUILD_SHA: ${{ github.sha }}
      BUILD_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: PathPilot-arm64-debug
          path: dist
      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]] || {
            echo 'Use a development tag such as v0.1.4-dev.1.' >&2; exit 1;
          }
          [[ "$RELEASE_TAG" == "v${APP_VERSION}-dev."* ]] || {
            echo 'Release tag must match the APK version.' >&2; exit 1;
          }
          (cd dist && sha256sum --check SHA256SUMS.txt)
          if [[ "$BUILD_REF" == refs/tags/* ]]; then
            test "$BUILD_REF" = "refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$BUILD_REF^{commit}")" = "$BUILD_SHA"
            git merge-base --is-ancestor "$BUILD_SHA" origin/main || {
              echo 'Release tag must point to a commit on main.' >&2; exit 1;
            }
          else
            test "$BUILD_REF" = refs/heads/main || { echo 'Publish only from main.' >&2; exit 1; }
          fi
          # Creation is non-destructive: existing tags/releases are never deleted or replaced.
          gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --paginate --jq '.[].ref' > existing-refs.txt
          if [[ "$BUILD_REF" != refs/tags/* ]] && grep -Fxq "refs/tags/$RELEASE_TAG" existing-refs.txt; then
            echo 'Tag already exists; choose a new development tag.' >&2
            exit 1
          fi
      - name: Create draft, upload verified APK and publish
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF_NOTES
          PathPilot ${APP_VERSION} 原生 Android 开发预发布版。

          - 仅支持 ARM64（arm64-v8a），Android 8.0 / API 26 或更新版本。
          - Codex 设备授权、DeepSeek/兼容供应商管理、模型路由和局域网共享。
          - 本次 Actions 已通过核心测试、Android Lint、APK 签名和 ARM64 架构检查。
          - APK 和 SHA256SUMS.txt 来自同一次成功构建，提交：${BUILD_SHA}。

          本版本为 debug 签名开发包。不同云端构建的 debug 签名可能不同，无法保证覆盖安装；卸载会清除本机配置和授权。正式分发前需配置长期签名密钥。
          真实账号调用及实体手机局域网联调仍需验证，具体结果见仓库 docs/validation.md。
          EOF_NOTES
          tag_options=()
          if [[ "$BUILD_REF" == refs/tags/* ]]; then tag_options+=(--verify-tag); fi
          gh release create "$RELEASE_TAG" --target "$BUILD_SHA" --draft --prerelease "${tag_options[@]}" \
            --title "PathPilot $RELEASE_TAG (ARM64 development preview)" \
            --notes-file release-notes.md \
            dist/PathPilot-*-arm64-debug.apk dist/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          echo "Release: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
